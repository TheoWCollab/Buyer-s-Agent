name: Buyer Agent

on:

  schedule:
    # Every Sunday 8:00 AM Brisbane
    - cron: '0 22 * * *'

  workflow_dispatch:

jobs:

  monitor:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Buyer Agent
        run: |
          python myer_price.py

      - name: Commit Updated Results
        run: |
          git config user.name "Buyer Agent"
          git config user.email "github-actions@users.noreply.github.com"

          git add .

          git diff --staged --quiet || git commit -m "Weekly buyer agent update"

          git push